<!doctype html>
<html lang="en">
  <head>
    <meta name="cis-build" content="production">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#131f38">
    <meta name="description" content="Local worship presentation, hymn, Bible, media and OBS control system.">
    <meta name="apple-mobile-web-app-title" content="VaChinoda">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>VaChinoda Worship App</title>
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/app-icon-192.png">

  <body>
    <div id="launchSplash" class="launch-splash" aria-hidden="true">
      <div class="launch-card">
        <div class="launch-mark">VC</div>
        <strong>VaChinoda Worship App</strong>
        <small>VaChinoda</small>
        <div class="launch-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div id="launchSplashError" class="launch-splash-error" hidden>
        <p id="launchSplashErrorText" role="alert"></p>
        <div class="launch-splash-actions">
          <button type="button" id="launchSplashRetry" class="btn btn-primary">Retry</button>
          <button type="button" id="launchSplashOpenLogs" class="btn btn-secondary">Open Logs</button>
        </div>
      </div>
    </div>
    <div id="app" class="app-shell">
      <aside class="sidebar rail" aria-label="Main navigation">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">VC</span>
          <div>
            <strong>VaChinoda Worship App</strong>
            <span>VaChinoda</span>
          </div>
        </div>
        <nav class="nav-list" id="primaryNav"></nav>
        <div class="sidebar-actions" aria-label="Emergency safety controls">
          <button class="icon-button safety-icon-btn" type="button" data-command="emergency-black" title="Blackout" aria-label="Blackout">■</button>
          <button class="icon-button safety-icon-btn" type="button" data-command="emergency-white" title="White screen" aria-label="White screen">□</button>
          <button class="icon-button safety-icon-btn" type="button" data-command="emergency-logo" title="Show Logo" aria-label="Show Logo">VC</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="topbarEyebrow">VaChinoda Worship App</p>
            <h1 id="pageTitle">Home Dashboard</h1>
          </div>
          <div class="topbar-tools">
            <div id="obsStatusRoot" class="obs-status-root" aria-live="polite"></div>
            <div id="languageToolbar" class="language-toolbar">
              <div id="uiLocaleSwitcher" class="ui-locale-switcher"></div>
              <div id="hymnBookSwitcher" class="hymn-book-switcher"></div>
              <div id="hymnEditionSwitcher" class="hymn-edition-switcher"></div>
            </div>
            <button class="tool-button" type="button" data-command="open-presenter" id="topbarPresenterBtn">Presenter</button>
            <button class="tool-button service-mode-enter-btn" type="button" data-command="service-mode-enter" id="topbarServiceModeBtn" aria-pressed="false">Enter Service Mode</button>
            <button class="tool-button quiet-service-mode-btn" type="button" data-command="quiet-service-mode-enter" id="topbarQuietServiceModeBtn" aria-pressed="false">Enter Quiet Service Mode</button>
            <div id="liveLockRoot" class="live-lock-root" aria-live="polite"></div>
            <button class="tool-button help-emergency-chip" type="button" data-command="help-open-emergency" title="Emergency Help" id="topbarEmergencyBtn">Emergency</button>
            <button class="tool-button" type="button" data-view="help" id="topbarHelpBtn" title="Help Centre (F1)">Help</button>
          </div>
        </header>
        <div id="quietServiceModeRoot" class="quiet-service-mode-root" aria-live="polite"></div>
        <div id="operatorStatusRoot" class="operator-status-root" aria-live="polite"></div>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="a11yAnnounce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="helpContextRoot" class="help-context-root hidden" aria-hidden="true"></div>
