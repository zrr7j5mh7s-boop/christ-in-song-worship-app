<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4C568"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#C9A227" stroke-opacity="0.35" stroke-width="3"/>

  <!-- musical note: notehead + stem -->
  <g>
    <ellipse cx="205" cy="345" rx="54" ry="40" transform="rotate(-18 205 345)" fill="url(#gold)"/>
    <rect x="248" y="120" width="24" height="228" fill="url(#gold)"/>

    <!-- eighth-note flag -->
    <path d="M272,120 C 330,132 352,168 340,214 C 336,178 312,152 272,168 Z" fill="url(#gold)"/>

    <!-- cross: horizontal bar through the stem -->
    <rect x="160" y="196" width="200" height="30" rx="4" fill="url(#gold)"/>
  </g>
</svg>
