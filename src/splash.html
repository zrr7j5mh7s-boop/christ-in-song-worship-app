<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>VaChinoda Worship App</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .card {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    background: radial-gradient(circle at 30% 20%, #1E3057 0%, #0F1A30 70%);
    border: 1px solid rgba(228, 197, 104, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    color: #F5EFE0;
    box-sizing: border-box;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #E4C568 0%, #C9A227 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #0F1A30;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #E4C568;
    letter-spacing: 0.3px;
  }
  p {
    margin: 6px 0 0 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(245, 239, 224, 0.55);
  }
  .dots {
    margin-top: 26px;
    display: flex;
    gap: 7px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(228, 197, 104, 0.35);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.15); background: #E4C568; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">VC</div>
    <h1>VaChinoda Worship App</h1>
    <p>VaChinoda</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
